<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jogo Clicker</title>
  
  <style>
    /* Estilização Geral (CSS) */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1e1e2e;
      color: #cdd6f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    h1 {
      margin-bottom: 10px;
      color: #89b4fa;
    }

    .container {
      background-color: #313244;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      text-align: center;
      width: 320px;
    }

    .score-display {
      font-size: 2.5rem;
      font-weight: bold;
      margin: 15px 0;
      color: #a6e3a1;
    }

    .cps-display {
      font-size: 0.9rem;
      color: #bac2de;
      margin-bottom: 20px;
    }

    /* Botão Principal de Clique */
    #click-btn {
      background-color: #89b4fa;
      color: #11111b;
      border: none;
      padding: 20px 40px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      user-select: none;
      width: 100%;
      margin-bottom: 25px;
    }

    #click-btn:active {
      transform: scale(0.95);
      background-color: #b4befe;
    }

    /* Seção de Melhorias (Upgrades) */
    .shop {
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
    }

    .upgrade-btn {
      background-color: #45475a;
      color: #cdd6f4;
      border: 2px solid #585b70;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background-color 0.2s, border-color 0.2s;
    }
