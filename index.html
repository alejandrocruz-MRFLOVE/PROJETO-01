<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dino Game - Fullscreen Meteor Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f7f7f7;
      font-family: 'Courier New', Courier, monospace;
      transition: background-color 1.5s ease;
      user-select: none;
    }

    body.dark-mode {
      background-color: #121316;
      color: #fff;
    }

    #game-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    /* --- TELA INICIAL (OVERLAY) --- */
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: rgba(247, 247, 247, 0.9);
      z-index: 10;
    }

    body.dark-mode #start-screen {
      background-color: rgba(18, 19, 22, 0.9);
    }

    #start-screen h1 {
      font-size: 36px;
      color: #333;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-align: center;
    }

    body.dark-mode #start-screen h1 {
      color: #fff;
    }

    #start-btn {
      padding: 16px 40px;
      font-size: 20px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      color: #fff;
      background-color: #e74c3c;
      border: 4px solid #c0392b;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 6px 0 #962d22;
      transition: all 0.1s ease;
    }

    #start-btn:hover {
      background-color: #ff5e4d;
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #962d22;
    }

    #start-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #962d22;
    }

    .instructions {
      margin-top: 25px;
      font-size: 15px;
      color: #666;
      text-align: center;
      line-height: 1.6;
    }

    body.dark-mode .instructions {
      color: #aaa;
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <div id="start-screen">
      <h1>Dino: O Último Salto</h1>
      <button id="start-btn">COMEÇAR</button>
      <p class="instructions">
        <strong>Espaço / Seta Cima</strong>: Pular | <strong>Seta Baixo</strong>: Abaixar<br>
        <strong>A / Ctrl</strong>: Atirar (quando equipado)
      </p>
    </div>

    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');

    // --- AJUSTE DE TELA CHEIA ---
    let groundY = 0;
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      groundY = canvas.height - 100;
      if (dino) dino.groundY = groundY - dino.normalHeight;
    }

    // --- EFEITO SONORO (Web Audio API) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'sine', duration = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // --- ESTADOS DO JOGO ---
    let gameStarted = false;
    let gameOver = false;
    let score = 0;
    let highScore = localStorage.getItem('dino_highscore_full') || 0;
    let speed = 7;
    let frameCount = 0;
    let isDarkMode = false;
    let lastScoreCheck = 0;

    // SISTEMA DE ARMA
    let hasGun = false;
    let ammo = 0;
    const bullets = [];
    const items = [];

    // SISTEMA DIA/NOITE (30 SEGUNDOS)
    let dayNightTimer = 0;
    const CYCLE_DURATION = 1800; // 30s * 60fps

    // --- CONTROLES DE TECLADO ---
    const keys = { up: false, down: false };

    // --- PARTÍCULAS ---
    const particles = [];
    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 4 + 2;
        this.vx = -speed * 0.4 + (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 0.5) * 2;
        this.life = 20;
        this.color = color;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
      }
      draw() {
        ctx.fillStyle = this.color || (isDarkMode ? 'rgba(255,255,255,0.3)' : 'rgba(83,83,83,0.3)');
        ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
      }
    }

    // --- CENÁRIO: NUVENS E ESTRELAS ---
    const clouds = [];
    const stars = [];

    function initBackgroundElements() {
      clouds.length = 0;
      stars.length = 0;
      for (let i = 0; i < 6; i++) {
        clouds.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * (window.innerHeight * 0.4) + 30,
          speed: Math.random() * 0.5 + 0.5
        });
      }
      for (let i = 0; i < 30; i++) {
        stars.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * (window.innerHeight * 0.5) + 10,
          size: Math.random() > 0.5 ? 2 : 3
        });
      }
    }

    // --- PROJÉTEIS (TIROS) ---
    class Bullet {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.speed = 15;
        this.width = 12;
        this.height = 4;
      }
      update() {
        this.x += this.speed;
      }
      draw() {
        ctx.fillStyle = '#ff3838';
        ctx.fillRect(this.x, this.y, this.width, this.height);
        ctx.fillStyle = '#fff000';
        ctx.fillRect(this.x - 4, this.y + 1, 4, 2);
      }
    }

    // --- ITENS (ARMA / MUNIÇÃO) ---
    class Item {
      constructor(type) {
        this.x = canvas.width;
        this.type = type; // 'gun' ou 'ammo'
        this.width = 24;
        this.height = 24;
        this.y = groundY - 30;
      }
      update() {
        this.x -= speed;
      }
      draw() {
        if (this.type === 'gun') {
          // Arma (Azul)
          ctx.fillStyle = '#2980b9';
          ctx.fillRect(this.x, this.y + 6, 20, 8);
          ctx.fillRect(this.x + 12, this.y + 14, 6, 8);
          ctx.fillStyle = '#3498db';
          ctx.fillRect(this.x + 4, this.y + 2, 12, 4);
        } else {
          // Caixa de Munição (Amarela)
          ctx.fillStyle = '#f39c12';
          ctx.fillRect(this.x, this.y, 22, 18);
          ctx.fillStyle = '#d35400';
          ctx.fillRect(this.x + 2, groundY - 30 + 2, 18, 14);
          ctx.fillStyle = '#f1c40f';
          ctx.font = 'bold 10px monospace';
          ctx.fillText('AMMO', this.x + 1, this.y + 12);
        }
      }
    }

    // --- DINOSSAURO ---
    const dino = {
      x: 80,
      groundY: 0,
      y: 0,
      normalWidth: 44,
      normalHeight: 47,
      duckWidth: 59,
      duckHeight: 30,
      width: 44,
      height: 47,
      velocityY: 0,
      gravity: 0.7,
      jumpForce: -13,
      isGrounded: true,
      isDucking: false,
      legFrame: 0,

      shoot() {
        if (hasGun && ammo > 0 && gameStarted && !gameOver) {
          ammo--;
          bullets.push(new Bullet(this.x + this.width, this.y + (this.isDucking ? 10 : 15)));
          playBeep(800, 'sawtooth', 0.05);
          if (ammo <= 0) {
            hasGun = false;
          }
        }
      },

      jump() {
        if (this.isGrounded && !this.isDucking) {
          this.velocityY = this.jumpForce;
          this.isGrounded = false;
          playBeep(450, 'square');
          for (let i = 0; i < 6; i++) {
            particles.push(new Particle(this.x + 10, this.groundY + 40));
          }
        }
      },

      update() {
        if (keys.down && this.isGrounded) {
          this.isDucking = true;
          this.width = this.duckWidth;
          this.height = this.duckHeight;
          this.y = this.groundY + 17;
        } else {
          this.isDucking = false;
          this.width = this.normalWidth;
          this.height = this.normalHeight;
          if (this.isGrounded) this.y = this.groundY;
        }

        if (keys.down && !this.isGrounded) {
          this.velocityY += this.gravity * 1.8;
        } else {
          this.velocityY += this.gravity;
        }

        this.y += this.velocityY;

        if (this.y >= (this.isDucking ? this.groundY + 17 : this.groundY)) {
          this.y = this.isDucking ? this.groundY + 17 : this.groundY;
          this.velocityY = 0;
          this.isGrounded = true;
        }

        if (frameCount % 5 === 0) {
          this.legFrame = this.legFrame === 0 ? 1 : 0;
        }

        if (this.isGrounded && gameStarted && !gameOver && frameCount % 5 === 0) {
          particles.push(new Particle(this.x, this.groundY + 40));
        }
      },

      draw() {
        const c = isDarkMode ? '#e8eaed' : '#535353';
        ctx.fillStyle = c;

        if (!this.isDucking) {
          ctx.fillRect(this.x + 12, this.y, 22, 25);     
          ctx.fillRect(this.x + 20, this.y - 12, 24, 16); 
          ctx.fillRect(this.x + 40, this.y - 4, 8, 8);   
          
          ctx.fillStyle = isDarkMode ? '#121316' : '#ffffff';
          ctx.fillRect(this.x + 34, this.y - 9, 4, 4);
          ctx.fillStyle = c;

          ctx.fillRect(this.x + 30, this.y + 12, 8, 4);  
          ctx.fillRect(this.x, this.y + 6, 12, 10);      
          ctx.fillRect(this.x - 4, this.y + 4, 6, 6);

          if (this.isGrounded && gameStarted && !gameOver) {
            if (this.legFrame === 0) {
              ctx.fillRect(this.x + 16, this.y + 25, 6, 14);
              ctx.fillRect(this.x + 28, this.y + 25, 6, 6);
            } else {
              ctx.fillRect(this.x + 16, this.y + 25, 6, 6);
              ctx.fillRect(this.x + 28, this.y + 25, 6, 14);
            }
          } else {
            ctx.fillRect(this.x + 16, this.y + 25, 6, 10);
            ctx.fillRect(this.x + 26, this.y + 25, 6, 10);
          }

          // Arma desenhada no Dino
          if (hasGun) {
            ctx.fillStyle = '#2980b9';
            ctx.fillRect(this.x + 32, this.y + 4, 16, 6);
            ctx.fillRect(this.x + 44, this.y + 6, 4, 2);
          }
        } else {
          ctx.fillRect(this.x + 10, this.y, 36, 18);     
          ctx.fillRect(this.x + 40, this.y + 2, 18, 12); 
          ctx.fillRect(this.x + 54, this.y + 6, 6, 6);   
          
          ctx.fillStyle = isDarkMode ? '#121316' : '#ffffff';
          ctx.fillRect(this.x + 50, this.y + 4, 3, 3);
          ctx.fillStyle = c;

          ctx.fillRect(this.x + 36, this.y + 12, 6, 4);  
          ctx.fillRect(this.x, this.y + 2, 10, 8);       

          if (this.legFrame === 0) {
            ctx.fillRect(this.x + 16, this.y + 18, 6, 10);
            ctx.fillRect(this.x + 32, this.y + 18, 6, 4);
          } else {
            ctx.fillRect(this.x + 16, this.y + 18, 6, 4);
            ctx.fillRect(this.x + 32, this.y + 18, 6, 10);
          }

          if (hasGun) {
            ctx.fillStyle = '#2980b9';
            ctx.fillRect(this.x + 46, this.y + 8, 14, 5);
          }
        }
      }
    };

    // --- OBSTÁCULOS (CACTOS E PTERODÁCTILOS) ---
    const obstacles = [];

    class Obstacle {
      constructor() {
        this.x = canvas.width;
        const types = score > 150 ? [0, 1, 2, 3, 3] : [0, 1, 2];
        this.type = types[Math.floor(Math.random() * types.length)];

        if (this.type === 0) {
          this.width = 20;
          this.height = 40;
          this.y = groundY - this.height;
        } else if (this.type === 1) {
          this.width = 40;
          this.height = 40;
          this.y = groundY - this.height;
        } else if (this.type === 2) {
          this.width = 28;
          this.height = 54;
          this.y = groundY - this.height;
        } else if (this.type === 3) {
          this.width = 46;
          this.height = 32;
          const heights = [groundY - 75, groundY - 45, groundY - 15];
          this.y = heights[Math.floor(Math.random() * heights.length)];
          this.wingFrame = 0;
        }
      }

      update() {
        this.x -= speed;
        if (this.type === 3 && frameCount % 8 === 0) {
          this.wingFrame = this.wingFrame === 0 ? 1 : 0;
        }
      }

      draw() {
        const c = isDarkMode ? '#acadbc' : '#258039';
        ctx.fillStyle = c;

        if (this.type < 3) {
          ctx.fillRect(this.x + 4, this.y, this.width - 8, this.height);
          ctx.fillRect(this.x, this.y + 10, this.width, 6);
          ctx.fillRect(this.x, this.y + 4, 4, 12);
          ctx.fillRect(this.x + this.width - 4, this.y + 6, 4, 14);
        } else {
          const pColor = isDarkMode ? '#e8eaed' : '#535353';
          ctx.fillStyle = pColor;
          
          ctx.fillRect(this.x + 14, this.y + 10, 24, 10);
          ctx.fillRect(this.x, this.y + 8, 14, 8);        
          ctx.fillRect(this.x + 38, this.y + 12, 8, 4);   

          if (this.wingFrame === 0) {
            ctx.fillRect(this.x + 18, this.y - 10, 10, 20);
          } else {
            ctx.fillRect(this.x + 18, this.y + 18, 10, 16);
          }
        }
      }
    }

    // --- ARTE DA TELA DE INÍCIO ---
    function drawStartBackground() {
      ctx.strokeStyle = isDarkMode ? '#e8eaed' : '#535353';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(canvas.width, groundY);
      ctx.stroke();

      ctx.fillStyle = isDarkMode ? '#e8eaed' : '#535353';
      const dx = canvas.width * 0.15, dy = groundY - 47;
      ctx.fillRect(dx + 12, dy, 22, 25);     
      ctx.fillRect(dx + 20, dy - 16, 20, 20); 
      ctx.fillRect(dx + 30, dy - 22, 12, 10); 
      
      ctx.fillStyle = isDarkMode ? '#121316' : '#ffffff';
      ctx.fillRect(dx + 34, dy - 18, 4, 4);
      ctx.fillStyle = isDarkMode ? '#e8eaed' : '#535353';

      ctx.fillRect(dx + 28, dy + 12, 6, 4);  
      ctx.fillRect(dx, dy + 6, 12, 10);      
      ctx.fillRect(dx + 16, dy + 25, 6, 14); 
      ctx.fillRect(dx + 28, dy + 25, 6, 14); 

      const meteorX = canvas.width * 0.75 + Math.sin(frameCount * 0.05) * 6;
      const meteorY = canvas.height * 0.2 + Math.cos(frameCount * 0.05) * 4;

      ctx.fillStyle = '#ff793f';
      ctx.beginPath();
      ctx.moveTo(meteorX + 30, meteorY - 20);
      ctx.lineTo(meteorX + 140, meteorY - 60);
      ctx.lineTo(meteorX + 50, meteorY + 20);
      ctx.fill();

      ctx.fillStyle = '#ffb142';
      ctx.beginPath();
      ctx.moveTo(meteorX + 25, meteorY - 12);
      ctx.lineTo(meteorX + 100, meteorY - 45);
      ctx.lineTo(meteorX + 40, meteorY + 12);
      ctx.fill();

      ctx.fillStyle = '#cd6133';
      ctx.fillRect(meteorX, meteorY, 40, 40);
      ctx.fillRect(meteorX + 8, meteorY - 8, 24, 56);
      ctx.fillRect(meteorX - 8, meteorY + 8, 56, 24);

      ctx.fillStyle = '#843b14';
      ctx.fillRect(meteorX + 8, meteorY + 10, 10, 10);
      ctx.fillRect(meteorX + 22, meteorY + 24, 8, 8);
    }

    // --- RENDERIZAR CEU E CICLO DIA/NOITE ---
    function drawEnvironment() {
      const mainColor = isDarkMode ? '#e8eaed' : '#535353';

      // Progresso no ciclo (0.0 a 1.0)
      const cycleProgress = (dayNightTimer % CYCLE_DURATION) / CYCLE_DURATION;
      const angle = cycleProgress * Math.PI; // Arco de 0 a PI

      const celestialX = canvas.width * cycleProgress;
      const celestialY = (canvas.height * 0.6) - Math.sin(angle) * (canvas.height * 0.45);

      if (isDarkMode) {
        // DESENHAR LUA
        ctx.fillStyle = '#f1f2f6';
        ctx.beginPath();
        ctx.arc(celestialX, celestialY, 28, 0, Math.PI * 2);
        ctx.fill();
        
        // Crateras
        ctx.fillStyle = '#ced6e0';
        ctx.beginPath();
        ctx.arc(celestialX - 8, celestialY - 6, 6, 0, Math.PI * 2);
        ctx.arc(celestialX + 10, celestialY + 8, 8, 0, Math.PI * 2);
        ctx.arc(celestialX + 4, celestialY - 10, 4, 0, Math.PI * 2);
        ctx.fill();

        // Estrelas
        ctx.fillStyle = '#ffffff';
        stars.forEach(s => ctx.fillRect(s.x, s.y, s.size, s.size));
      } else {
        // DESENHAR SOL
        ctx.fillStyle = '#f1c40f';
        ctx.beginPath();
        ctx.arc(celestialX, celestialY, 32, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(241, 196, 15, 0.2)';
        ctx.beginPath();
        ctx.arc(celestialX, celestialY, 42, 0, Math.PI * 2);
        ctx.fill();
      }

      // Nuvens
      clouds.forEach(cloud => {
        if (gameStarted && !gameOver) cloud.x -= cloud.speed;
        if (cloud.x < -60) cloud.x = canvas.width + 20;

        ctx.fillStyle = isDarkMode ? '#2c3e50' : '#d3d3d3';
        ctx.fillRect(cloud.x, cloud.y, 50, 12);
        ctx.fillRect(cloud.x + 12, cloud.y - 10, 26, 10);
      });

      // Linha do chão
      ctx.strokeStyle = mainColor;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(canvas.width, groundY);
      ctx.stroke();

      // Textura do chão
      ctx.fillStyle = mainColor;
      for (let i = 0; i < canvas.width; i += 50) {
        const bumpX = (i - (frameCount * speed * 0.5)) % canvas.width;
        const realX = bumpX < 0 ? canvas.width + bumpX : bumpX;
        ctx.fillRect(realX, groundY + 4, 5, 2);
        ctx.fillRect((realX + 20) % canvas.width, groundY + 8, 3, 2);
      }
    }

    // --- LOOP PRINCIPAL ---
    let spawnTimer = 0;

    function gameLoop() {
      frameCount++;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!gameStarted) {
        drawStartBackground();
      } else {
        if (!gameOver) {
          dayNightTimer++;

          // Alterna Dia / Noite a cada 30 segundos (1800 frames)
          if (dayNightTimer % CYCLE_DURATION === 0) {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark-mode', isDarkMode);
          }
        }

        drawEnvironment();

        if (!gameOver) {
          score += 0.15;
          speed += 0.0008;

          // LÓGICA DE CHANCE DA ARMA A CADA 100 PONTOS
          const currentScoreCheck = Math.floor(score / 100);
          if (currentScoreCheck > lastScoreCheck) {
            lastScoreCheck = currentScoreCheck;
            if (Math.random() < 0.15) { // 15% de chance
              const itemType = hasGun ? 'ammo' : 'gun';
              items.push(new Item(itemType));
            }
          }

          spawnTimer++;
          if (spawnTimer > Math.max(40, 85 - speed * 2.5)) {
            if (Math.random() < 0.65) {
              obstacles.push(new Obstacle());
              spawnTimer = 0;
            }
          }

          // Atualizar partículas
          for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw();
            if (particles[i].life <= 0) particles.splice(i, 1);
          }

          // Atualizar ITENS
          for (let i = items.length - 1; i >= 0; i--) {
            const item = items[i];
            item.update();
            item.draw();

            // Colisão Dino com Item
            if (
              dino.x < item.x + item.width &&
              dino.x + dino.width > item.x &&
              dino.y < item.y + item.height &&
              dino.y + dino.height > item.y
            ) {
              if (item.type === 'gun') {
                hasGun = true;
                ammo = 10;
              } else {
                ammo += 10;
              }
              playBeep(600, 'sine', 0.1);
              items.splice(i, 1);
            } else if (item.x + item.width < 0) {
              items.splice(i, 1);
            }
          }

          // Atualizar PROJÉTEIS (TIROS)
          for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.update();
            b.draw();

            // Colisão Tiro com Obstáculo
            for (let j = obstacles.length - 1; j >= 0; j--) {
              const o = obstacles[j];
              if (
                b.x < o.x + o.width &&
                b.x + b.width > o.x &&
                b.y < o.y + o.height &&
                b.y + b.height > o.y
              ) {
                // Efeito visual de explosão
                for (let k = 0; k < 8; k++) {
                  particles.push(new Particle(o.x + o.width / 2, o.y + o.height / 2, '#e74c3c'));
                }
                playBeep(200, 'square', 0.1);
                obstacles.splice(j, 1);
                bullets.splice(i, 1);
                break;
              }
            }

            if (b && b.x > canvas.width) {
              bullets.splice(i, 1);
            }
          }

          // Atualizar OBSTÁCULOS
          for (let i = obstacles.length - 1; i >= 0; i--) {
            const o = obstacles[i];
            o.update();
            o.draw();

            const padding = 6;
            if (
              dino.x + padding < o.x + o.width &&
              dino.x + dino.width - padding > o.x &&
              dino.y + padding < o.y + o.height &&
              dino.y + dino.height - padding > o.y
            ) {
              triggerGameOver();
            }

            if (o.x + o.width < 0) {
              obstacles.splice(i, 1);
            }
          }

          dino.update();
        }

        dino.draw();
        drawUI();
      }

      requestAnimationFrame(gameLoop);
    }

    // --- INTERFACE DE USUÁRIO ---
    function drawUI() {
      ctx.fillStyle = isDarkMode ? '#e8eaed' : '#535353';
      ctx.font = '20px "Courier New"';
      
      // Pontuação
      ctx.textAlign = 'right';
      const currentFormatted = Math.floor(score).toString().padStart(5, '0');
      const highFormatted = Math.floor(highScore).toString().padStart(5, '0');
      ctx.fillText(`HI ${highFormatted}  ${currentFormatted}`, canvas.width - 30, 40);

      // Munição e Arma
      if (hasGun || ammo > 0) {
        ctx.textAlign = 'left';
        ctx.fillStyle = '#e74c3c';
        ctx.fillText(`MUNICIÇÃO: ${ammo}`, 30, 40);
      }

      ctx.textAlign = 'center';
      if (gameOver) {
        ctx.fillStyle = isDarkMode ? '#e8eaed' : '#535353';
        ctx.font = 'bold 28px "Courier New"';
        ctx.fillText("G A M E   O V E R", canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = '16px "Courier New"';
        ctx.fillText("Pressione Espaço para Reiniciar", canvas.width / 2, canvas.height / 2 + 20);
      }
    }

    function triggerGameOver() {
      gameOver = true;
      playBeep(120, 'sawtooth', 0.3);

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('dino_highscore_full', highScore);
      }
    }

    function startGame() {
      startScreen.style.display = 'none';
      score = 0;
      speed = 7;
      lastScoreCheck = 0;
      dayNightTimer = 0;
      isDarkMode = false;
      document.body.classList.remove('dark-mode');
      
      hasGun = false;
      ammo = 0;
      
      obstacles.length = 0;
      particles.length = 0;
      bullets.length = 0;
      items.length = 0;

      gameOver = false;
      gameStarted = true;
      dino.y = dino.groundY;
      dino.velocityY = 0;
    }

    // --- EVENTOS E CONTROLES ---
    window.addEventListener('resize', () => {
      resizeCanvas();
      initBackgroundElements();
    });

    startBtn.addEventListener('click', () => {
      startGame();
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        if (!gameStarted) {
          startGame();
        } else if (gameOver) {
          startGame();
        } else {
          dino.jump();
        }
      }
      if (e.code === 'ArrowDown') {
        e.preventDefault();
        keys.down = true;
      }
      if (e.code === 'KeyA' || e.code === 'ControlLeft' || e.code === 'ControlRight') {
        e.preventDefault();
        dino.shoot();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowDown') {
        keys.down = false;
      }
    });

    // Iniciar
    resizeCanvas();
    initBackgroundElements();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
