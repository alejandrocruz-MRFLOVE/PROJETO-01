<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dino Game - Fullscreen Deluxe Edition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-wrapper">
    <div id="qte-container">
      <div id="qte-btn">1</div>
    </div>

    <div id="start-screen" class="overlay-screen">
      <h1>Dino: O Último Salto</h1>
      <button id="start-btn" class="btn-action">COMEÇAR</button>
      <p class="instructions">
        <strong>Espaço / Seta Cima</strong>: Pular / Pulo Duplo (Gira no Ar)<br>
        <strong>Seta Baixo</strong>: Abaixar | <strong>A / Ctrl</strong>: Atirar<br>
        <strong>Boss no ponto 500</strong>: Aperte a tecla numérica no tempo certo!
      </p>
    </div>

    <div id="game-over-screen" class="overlay-screen hidden">
      <h1>G A M E   O V E R</h1>
      <div class="stats-board">
        <p>PONTUAÇÃO: <span id="final-score">00000</span></p>
        <p>RECORDE: <span id="final-highscore">00000</span></p>
        <p>MUNIÇÃO RESTANTE: <span id="final-ammo">0</span></p>
      </div>
      <button id="restart-btn" class="btn-action">RENASCER ⚡</button>
    </div>

    <canvas id="gameCanvas"></canvas>
  </div>

  <script src="script.js"></script>
</body>
</html>u
